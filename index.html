<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fly Explorer — a real fly connectome</title>
<style>
  /* DESIGN.md 定案字型(Google Fonts;artifact CSP 允許 fonts.googleapis.com)。用 @import 是因為 build_artifact 只搬 <style>,不搬 <link>。 */
  @import url("https://fonts.googleapis.com/css2?family=Huninn&family=Bricolage+Grotesque:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap");
  html,body{margin:0;height:100%;background:#07090a;overflow:hidden;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    font-family:"IBM Plex Sans","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#dfe6e0}
  /* canvas 釘成覆蓋整個視窗的固定層:確保它是拖曳事件的接收者,
     不會因為版面流動而被其他元素蓋住。z-index 0 讓 UI(z>0)畫在上面。 */
  canvas{display:block;position:fixed;inset:0;z-index:0;touch-action:none}
  #top,#perf,#bottom{z-index:2}
  #gaugeHost{width:min(320px,100%);height:112px;
    background:rgba(8,12,10,.72);border:1px solid #2a3330;border-radius:3px;backdrop-filter:blur(6px)}
  #gaugeHost canvas.gauge{width:100%;height:100%;display:block}
  #pip{position:relative;width:min(320px,100%);height:150px;border:1px solid #3a4258;border-radius:3px;
    background:transparent;pointer-events:none}
  #pip .pipTitle{position:absolute;left:8px;top:6px;font:10.5px "IBM Plex Mono",monospace;color:#9AA8C4;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  /* 頁尾:兩行依序堆疊,寬度由容器決定,不可能互疊(絕對定位互疊是本專案第三次栽) */
  #pip .pipFoot{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;
    padding:4px 8px 5px;background:linear-gradient(transparent,rgba(8,12,10,.85) 40%);font-family:"IBM Plex Mono",monospace}
  #pip #pipRead{font-size:10px;color:#dfe6e0;opacity:.9;line-height:1.3}
  #pip .pipNote{font-size:9px;color:#8a93a8;opacity:.85;line-height:1.3}
  #panels{display:contents}
  #pip .pipNote .short,#pip .pipTitle .short{display:none}
  #top{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;align-items:flex-start;
    gap:8px;max-width:min(400px,calc(100vw - 24px));pointer-events:none}   /* 400:七顆模式鈕一列(360 會把 － 擠到第二行) */
  #top > *{pointer-events:auto}
  #hud{font-size:12px;line-height:1.6;text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none}
  #hud b{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;display:block}
  #hud #drawn{display:block;font-size:11px;opacity:.7}   /* 抽樣時說明「這台裝置畫出幾顆」;手機不隱藏,#sub 才隱藏 */
  #legend{font-size:11.5px;line-height:1.9;
    font-family:"IBM Plex Mono",monospace;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #legend i{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%}
  #perf{position:fixed;right:16px;top:14px;font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;text-align:right;opacity:.75;text-shadow:0 1px 3px rgba(0,0,0,.9);
    max-width:38vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #legend{columns:2;column-gap:18px}
  #bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:0 12px 12px;pointer-events:none}
  #bottom > *{pointer-events:auto}
  /* 純文字層不吃觸控:手機上階段字幕疊在果蠅下半身,若吃事件,拖那裡就轉不動(使用者實機) */
  #stage,#prov{pointer-events:none}
  /* 字幕開關(2026-09-16):關掉時字幕區與放電計數一起收,只留一枚洋紅角標——「這段是注入/我們加的」永遠看得到 */
  #stage .itag{display:none}
  body.nocap #stage > *:not(.itag),body.nocap #spk{display:none!important}   /* !important:手機的四行截斷規則特異性更高,會把說明段又打開 */
  body.nocap #stage .itag{display:inline-block;font:500 10px "IBM Plex Mono",monospace;color:#C8629E;border:1px solid #C8629E;padding:2px 7px;border-radius:2px;text-shadow:none}
  #stage{text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.95);max-width:min(560px,94vw)}
  #stage b{display:block;font-size:15px;margin-bottom:2px}
  #stage .cnt{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.7;margin-top:3px}
  #stage .inj{color:#C8629E}
  #stage .src{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;opacity:.45;margin-top:2px}
  #player{display:flex;align-items:center;gap:12px;padding:9px 14px;
    background:rgba(10,14,12,.82);border:1px solid #2a3330;border-radius:3px;
    font-family:"IBM Plex Mono",monospace;font-size:12px;backdrop-filter:blur(6px)}
  #player button{background:none;border:1px solid #3d4a45;color:#dfe6e0;
    width:30px;height:26px;cursor:pointer;font-size:12px;border-radius:2px}
  #player button:focus-visible,#speed:focus-visible,#scrub:focus-visible{outline:2px solid #C8629E}
  #scrub{width:min(240px,42vw);accent-color:#8fe3a8}
  #clock{min-width:62px;text-align:right;white-space:nowrap}
  #clock .inj{color:#C8629E}
  #speed{background:#141a17;color:#dfe6e0;border:1px solid #3d4a45;font-size:11px;padding:3px}
  #prov{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;
    font-size:10.5px;opacity:.75;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #prov i{display:inline-block;width:18px;height:0;margin-right:6px;vertical-align:middle}
  #prov .dot{border-top:3px dotted #8fe3a8}
  #prov .inj{border-top:2px dashed #C8629E}
  #prov .drw{border-top:1.5px solid #9AA8C4}
  #prov .mus{border-top:2px solid #E8A34A}
  #prov em{font-style:normal;opacity:.55}
  #legend{columns:1}
  #modes{display:flex;flex-wrap:wrap;gap:0;row-gap:6px}
  #modes button{font:500 10.5px/1 "IBM Plex Mono",monospace;padding:6px 10px;cursor:pointer;
    background:rgba(10,14,12,.7);border:1px solid #2a3330;color:#96a29a}
  #modes button:first-child{border-radius:2px 0 0 2px}
  #modes button:last-child{border-radius:0 2px 2px 0;border-left:0}
  #modes button.sep{margin-left:8px;border-left:1px solid #2a3330;border-radius:2px}
  #modes button.sep[aria-pressed="true"]{color:#9AA8C4;border-color:#4a5468;background:#1a1d24}
  #modes button[aria-pressed="true"]{background:#1d2a22;color:#8fe3a8;border-color:#3d5a48}
  #modes button:focus-visible{outline:2px solid #C8629E;outline-offset:-2px}
  @media (max-width:560px){
    #prov{font-size:9px;gap:2px 10px} #prov em{display:none}   /* 手機:圖例的括號註解收掉,英文版底欄長高會把計數器頂到面板上 */
    /* 播放列塞進 308px:原本 30+240+62+選單 ≈ 416px,播放鈕與速度選單雙雙超出螢幕(使用者實機截圖)。
       時間軸改彈性、速度選單限寬(瀏覽器會截掉選項文字尾巴,選單展開時仍看得到全文) */
    #player{gap:6px;padding:7px 8px;width:100%;box-sizing:border-box}
    #scrub{flex:1 1 60px;min-width:60px;width:auto}
    #clock{min-width:0;font-size:11px}
    #speed{max-width:96px;font-size:10px;padding:3px 2px}
    #stage{font-size:12px} #stage b{font-size:13.5px}
    #stage > span:not(.cnt):not(.src):not(.itag){display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}   /* 手機:長字幕最多四行,否則底欄長高把計數器頂到面板上(英文版實測) */
    #legend{font-size:9.5px;line-height:1.6}
    #modes button{padding:5px 7px;font-size:9.5px} #modes button.sep{margin-left:5px} #modes .ic{display:none}   /* 七顆鈕塞進一列,不折行吃掉主畫面 */
  }
  @media (max-width:560px){
    #hud{font-size:11px} #hud b{font-size:13.5px}
    #perf{font-size:10px;max-width:34vw}
    #gaugeHost{width:100%;height:92px}
    #panels{display:flex;flex-direction:row;gap:6px;width:100%}
    /* 電壓計 42% / PiP 58%:對半分時 PiP 的標題與讀數全部折行,果蠅剩一枚縮圖(無頭截圖確認) */
    #top{width:calc(100vw - 24px)}     /* 否則 #top 縮到最寬子元素(模式鈕列)的寬度,面板列只剩 200px */
    #gaugeHost{flex:0 0 40%;width:auto;height:132px}
    #pip{flex:1 1 auto;width:auto;height:132px}
    #pip .pipTitle .long{display:none} #pip .pipTitle .short{display:inline}
    #pip #pipRead .rd{display:block} #pip #pipRead .sep{display:none}
    #pip .pipNote .long{display:none} #pip .pipNote .short{display:inline}
    #stage .src{display:none}
    #mCards{display:none}   /* 索引入口在小籤列的「📖 全部」;第八顆鈕會把模式列擠成兩行 */
    #mZoomIn,#mZoomOut{display:none}   /* 手機用兩指縮放;加了「字幕」鈕後這兩顆會把模式列擠成兩行 */
    #hud #sub{display:none}   /* 抽樣 1/2 的說明在階段字幕裡還有一份 */
    #pip .pipNote{font-size:8.5px}
    #top{gap:6px;max-width:calc(100vw - 24px)}

  }


  /* ===== 實驗台:換刺激條件,看真的跑出來的結果 ===== */
  #lab[hidden]{display:none}
  #lab{position:fixed;z-index:6;right:12px;top:12px;bottom:12px;width:min(420px,calc(100vw - 24px));
    display:flex;flex-direction:column;background:#FAF7F0;color:#25221E;border:1px solid #C9C1B2;border-radius:3px;
    font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #lab .labBar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
    border-bottom:1px solid #D9D2C4;font:700 15px "Noto Serif TC",serif}
  #lab .labBar button{background:none;border:1px solid #C9C1B2;border-radius:2px;color:#686057;
    font:500 12px "IBM Plex Mono",monospace;padding:5px 9px;cursor:pointer}
  #lab .labBody{overflow:auto;padding:14px}
  #lab .lead{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:#686057}
  #lab .grp{margin-bottom:10px}
  #lab .grp h4{margin:0 0 6px;font:500 12px "IBM Plex Mono",monospace;color:#862F36}
  #lab .cond{display:inline-block;margin:0 6px 6px 0;padding:7px 11px;cursor:pointer;
    background:#EDE8DF;border:1px solid #C9C1B2;border-radius:2px;color:#25221E;font-size:13.5px;text-align:left}
  #lab .cond.on{background:#243D83;border-color:#243D83;color:#FAF7F0;font-weight:500}
  #lab .result{margin-top:12px;border:1px solid #D9D2C4;border-radius:2px;background:#fff}
  #lab .rhead{padding:10px 12px;border-bottom:1px solid #D9D2C4;font-weight:500;font-size:14.5px}
  #lab .rhead span{display:block;font:400 12px "IBM Plex Mono",monospace;color:#686057;margin-top:2px}
  #lab .chain{padding:4px 12px}
  #lab .step{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid #EDE8DF;font-size:13.5px}
  #lab .step:last-child{border-bottom:0}
  #lab .step b{min-width:6.5em;font-weight:500}
  #lab .step .when{font:400 12.5px "IBM Plex Mono",monospace;color:#25221E}
  #lab .step .runs{margin-left:auto;font:400 11.5px "IBM Plex Mono",monospace;color:#686057}
  #lab .step .rng{color:#686057}
  #lab .step.dead{background:#FBEFEF}
  #lab .step.dead .when{color:#862F36;font-weight:500}
  #lab .tot{padding:9px 12px;border-top:1px solid #D9D2C4;font:400 13px "IBM Plex Mono",monospace;color:#686057}
  #lab .tot b{color:#25221E}
  #lab #labPlay{display:block;width:calc(100% - 24px);margin:0 12px 12px;padding:10px;cursor:pointer;
    background:#243D83;color:#FAF7F0;border:0;border-radius:2px;font:500 14px "Noto Sans TC",sans-serif}
  #lab .nodata{margin:0;padding:10px 12px 12px;font-size:12.5px;color:#686057}
  #lab .proto{margin:12px 0 0;font-size:11.5px;line-height:1.55;color:#686057}
  #lab .proto.strong{color:#862F36}
  @media (max-width:560px){
    #lab{left:8px;right:8px;top:auto;bottom:8px;max-height:76vh;width:auto}
    #lab .labBody{padding:10px}
    #lab .lead{font-size:12.5px;margin-bottom:9px}
    #lab .cond{font-size:12px;padding:6px 8px;margin:0 4px 4px 0}
    #lab .step{font-size:12.5px;flex-wrap:wrap;gap:4px}
    #lab .step b{min-width:5.5em}
    #lab .step .runs{margin-left:0;flex-basis:100%}
    #lab .proto{font-size:10.5px}
  }
  /* ===== 說明卡抽屜:DESIGN.md「標本劇場 + 一張紙」。舞台不動,兩套皮膚只換這張紙。 ===== */
  #spk{font:500 11px "IBM Plex Mono",monospace;color:#c9cbc4;text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none}
  #spk b{color:#8fe3a8;font-weight:500}   /* 數字是真資料 → 允許發光綠 */
  #spk .inj{color:#C8629E}
  #chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  #chips button{font:500 11px/1 "IBM Plex Mono",monospace;padding:6px 10px;border-radius:14px;cursor:pointer;
    background:rgba(20,26,22,.85);border:1px solid #3d5a48;color:#8fe3a8;backdrop-filter:blur(6px)}
  #chips button.all{color:#9AA8C4;border-color:#3a4258}
  #sheet[hidden]{display:none}
  #sheet{position:fixed;z-index:5;right:12px;top:12px;bottom:12px;width:min(400px,calc(100vw - 24px));
    display:flex;flex-direction:column;color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
    box-shadow:0 8px 40px rgba(0,0,0,.6)}
  /* 兒童「探索票」W1 午後陽光 */
  #sheet.kid{--paper:#F6E3BE;--card:#FFF8E8;--ink:#3A2614;--muted:#7C5D3C;--act:#3B6FD9;--mark:#D2452B;--edge:#E0C79A;
    background:var(--paper);border:1px solid var(--edge);border-radius:4px;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 1px,transparent 1px 3px)}
  /* 教科書「圖鑑頁」 */
  #sheet.more{--paper:#EDE8DF;--card:#FAF7F0;--ink:#25221E;--muted:#686057;--act:#243D83;--mark:#862F36;--edge:#C9C1B2;
    background:var(--card);border:1px solid var(--edge);border-radius:0}
  .sheetBar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
  .sheetBar .grp{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden;background:var(--card)}
  .sheetBar .grp button{font:600 11px/1 "Source Sans 3","Noto Sans TC",sans-serif;padding:7px 10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
  .sheetBar .grp button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .sheetBar .lnk{margin-left:auto;font:600 11px "Source Sans 3","Noto Sans TC",sans-serif;background:none;border:0;color:var(--act);cursor:pointer;text-decoration:underline}
  #sheetClose{width:28px;height:26px;background:none;border:1px solid var(--edge);color:var(--ink);border-radius:2px;cursor:pointer}
  #sheetBody{flex:1 1 auto;overflow:auto;padding:14px 16px 18px;line-height:1.65}
  #sheetBody h3{font:600 11px "Source Sans 3","Noto Sans TC",sans-serif;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
  #sheetBody ul.idx{list-style:none;margin:0;padding:0}
  #sheetBody ul.idx button{width:100%;text-align:left;padding:8px 10px;margin:3px 0;background:var(--card);border:1px solid var(--edge);color:var(--ink);border-radius:4px;cursor:pointer;font:500 14px "Noto Sans TC",sans-serif}
  .sheetNav{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--edge);font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
  .sheetNav button{width:30px;height:26px;background:var(--card);border:1px solid var(--edge);color:var(--ink);border-radius:2px;cursor:pointer}
  .sheetNav button:disabled{opacity:.3;cursor:default}
  .sheetNav .marks{margin-left:auto;font-size:9.5px}
  /* 卡片本體:兒童 */
  #sheet.kid .num{font:800 40px/1 "Bricolage Grotesque",sans-serif;color:var(--mark);letter-spacing:-.03em}
  #sheet.kid .mod{font:500 12px "Noto Sans TC",sans-serif;color:var(--muted);letter-spacing:.06em;margin:2px 0 6px}
  #sheet.kid h2{font:400 26px/1.3 "Huninn","Noto Sans TC",sans-serif;margin:0 0 10px;color:var(--ink)}
  #sheet.kid .txt{font:400 17px/1.65 "Noto Sans TC",sans-serif;margin:0 0 12px}
  #sheet.kid .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  #sheet.kid .fact{flex:1 1 120px;border:1px solid var(--edge);border-radius:4px;background:var(--card);padding:8px 10px;font-size:12px;line-height:1.4;color:var(--muted)}
  #sheet.kid .fact b{display:block;font:800 18px "Bricolage Grotesque","Noto Sans TC",sans-serif;color:var(--ink);margin-bottom:2px;letter-spacing:-.01em}
  #sheet.kid .fact details{margin-top:4px;font-size:10px} #sheet.kid .fact code{font-size:9.5px;word-break:break-all}
  #sheet.kid .q{border:1.5px solid var(--edge);border-radius:4px;padding:10px 12px;margin:0 0 12px;background:rgba(255,255,255,.35)}
  #sheet.kid .q .qt{margin:0 0 8px;font:400 20px/1.35 "Huninn","Noto Sans TC",sans-serif}
  #sheet.kid .q .opts{display:flex;flex-direction:column;gap:8px}
  #sheet.kid .q .opt{min-height:48px;text-align:left;padding:8px 14px;border:1.5px solid var(--edge);background:var(--card);color:var(--ink);border-radius:4px;cursor:pointer;font:600 16px/1.3 "Noto Sans TC",sans-serif}
  #sheet.kid .q .opt.ok{border-color:var(--mark);color:var(--mark);box-shadow:inset 0 0 0 1px var(--mark)}
  #sheet.kid .q .opt.no{border-color:var(--act);color:var(--act)} #sheet.kid .q .opt.dim{opacity:.45}
  #sheet.kid .q .fb{margin:10px 0 0;font:400 17px/1.5 "Huninn","Noto Sans TC",sans-serif} #sheet.kid .q .fb.ok{color:var(--mark)} #sheet.kid .q .fb.no{color:var(--act)}
  /* 卡片本體:教科書 */
  #sheet.more .num{display:none}
  #sheet.more .mod{font:600 13px "Source Sans 3","Noto Sans TC",sans-serif;color:var(--mark);letter-spacing:.02em}
  #sheet.more h2{font:700 21px/1.35 "Noto Serif TC",serif;margin:4px 0 8px}
  #sheet.more .txt{font:400 15px/1.7 "Noto Sans TC",sans-serif;margin:0 0 10px}
  #sheet.more table.ftab{width:100%;border-collapse:collapse;font:400 12px/1.4 "Source Sans 3","Noto Sans TC",sans-serif;margin-top:6px}
  #sheet.more .ftab th{text-align:left;font:600 11px "Source Sans 3",sans-serif;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--ink);padding:4px 5px}
  #sheet.more .ftab td{padding:5px;border-bottom:1px solid #D9D2C4;vertical-align:top;color:var(--ink)}
  #sheet.more .ftab td b{font:600 13px "Source Sans 3",sans-serif;color:var(--mark)} #sheet.more .ftab code{font-size:9.5px;color:var(--muted);word-break:break-all}
  #sheet.more .refs{margin:10px 0 0;padding:0;list-style:none;font:400 11px/1.5 "Source Sans 3","Noto Sans TC",sans-serif;color:var(--muted)}
  #sheet.more .refs li{padding-left:1.6em;text-indent:-1.6em;margin:2px 0}
  #sheet.more .q{border:1px solid var(--edge);padding:10px 12px;margin:0 0 12px}
  #sheet.more .q .qt{margin:0 0 8px;font:600 15px/1.5 "Noto Sans TC",sans-serif}
  #sheet.more .q .opts{display:flex;flex-direction:column;gap:6px}
